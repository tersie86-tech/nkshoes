<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LJR - Premium Catalog</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f7f7f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .phone-wrapper { width: 100%; max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; padding-bottom: 80px; }

        header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -1px; }

        /* 商品列表 */
        .container { display: flex; flex-wrap: wrap; padding: 6px; }
        .product-card { width: 50%; padding: 6px; cursor: pointer; }
        .card-inner { border: 1px solid #efefef; border-radius: 12px; overflow: hidden; background: #fff; }
        .img-box { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: #fff; }
        .img-box img { width: 95%; height: 95%; object-fit: contain; }
        .info { padding: 12px; text-align: center; }
        .info h3 { font-size: 11px; height: 32px; overflow: hidden; margin-bottom: 6px; color: #333; line-height: 1.3; }
        .price { color: #d0021b; font-weight: 800; font-size: 16px; }

        /* 详情弹窗 */
        #detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; display: none; flex-direction: column; overflow-y: auto; }
        .close-bar { position: sticky; top: 0; background: rgba(255,255,255,0.9); padding: 15px; border-bottom: 1px solid #eee; z-index: 1001; }
        .back-btn { background: #000; color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .detail-content { width: 100%; max-width: 500px; margin: 0 auto; }
        .detail-img { width: 100%; display: block; margin-bottom: 2px; }
        .detail-desc { padding: 20px; text-align: left; }
        .detail-desc h2 { font-size: 18px; margin-bottom: 10px; font-weight: 800; }
        
        /* WhatsApp 按钮 */
        .whatsapp-btn { 
            display: flex; align-items: center; justify-content: center;
            background: #25d366; color: #fff; text-decoration: none;
            padding: 15px; border-radius: 10px; font-weight: 800; 
            margin-top: 20px; border: none; width: 100%; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,211,102,0.3);
        }
        .whatsapp-btn:active { transform: scale(0.98); background: #1ebe57; }

        footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #fff; padding: 15px; border-top: 1px solid #eee; text-align: center; }
        .contact-footer { color: #25d366; font-weight: bold; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <header><div class="logo">KICK12 NIKE</div></header>
    <div class="container" id="product-list"></div>
    <footer>
        <a href="https://wa.me/你的电话" class="contact-footer">Direct Message WhatsApp</a>
    </footer>
</div>

<!-- 详情弹窗层 -->
<div id="detail-overlay">
    <div class="close-bar">
        <button class="back-btn" onclick="closeDetails()">← Back to List</button>
    </div>
    <div class="detail-content" id="detail-content"></div>
    <div class="detail-desc" id="detail-text"></div>
    <div style="height: 50px;"></div>
</div>

<script>
    // 1. 【配置你的 WhatsApp】
    // 格式：国家代码+号码，不要加号。例如越南 84123456789
    const myPhone = "84123456789"; 

    // 2. 【核心数据库】
    const products = [
        { 
            name: "Nike Dunk Low 'Panda' Black White", 
            price: "$110.00",
            main: "dunk-panda/thumb.jpg", 
            details: ["dunk-panda/1.jpg", "dunk-panda/2.jpg", "dunk-panda/3.jpg"] 
        },
        { 
            name: "Nike Kobe 6 Protro 'Reverse Grinch'", 
            price: "$165.00",
            main: "kobe-grinch/thumb.jpg", 
            details: ["kobe-grinch/1.jpg", "kobe-grinch/2.jpg"]
        }
        // 继续添加...
    ];

    // 渲染首页列表
    const listContainer = document.getElementById('product-list');
    products.forEach((p, index) => {
        listContainer.innerHTML += `
            <div class="product-card" onclick="showDetails(${index})">
                <div class="card-inner">
                    <div class="img-box"><img src="images/${p.main}"></div>
                    <div class="info">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price}</div>
                    </div>
                </div>
            </div>
        `;
    });

    // 打开详情
    function showDetails(index) {
        const p = products[index];
        const content = document.getElementById('detail-content');
        const text = document.getElementById('detail-text');
        
        // 渲染详情图
        content.innerHTML = p.details.map(img => `<img src="images/${img}" class="detail-img">`).join('');
        
        // 渲染文字和购买按钮
        text.innerHTML = `
            <h2>${p.name}</h2>
            <div class="price" style="font-size:22px">${p.price}</div>
            <p style="margin-top:10px; color:#666; font-size:13px;">Shipping: Worldwide Express (5-10 days)</p>
            <button class="whatsapp-btn" onclick="orderNow('${p.name}')">
                ORDER ON WHATSAPP
            </button>
        `;

        document.getElementById('detail-overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    }

    // 关闭详情
    function closeDetails() {
        document.getElementById('detail-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // 跳转 WhatsApp 函数
    function orderNow(name) {
        const text = "Hi KICK12, I am interested in: " + name;
        const url = "https://wa.me/" + myPhone + "?text=" + encodeURIComponent(text);
        window.location.href = url;
    }
</script>

</body>
</html>
