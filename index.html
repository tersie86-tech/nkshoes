<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LJR PREMIUM SNEAKERS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --main-color: #000; --accent-color: #e41e31; --bg-gray: #f8f8f8; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #fff; color: #111; }
        
        .sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; }
        .header { padding: 15px 0 5px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; font-style: italic; }
        
        .search-container { padding: 10px 15px; }
        #search-input { 
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; 
            font-size: 14px; outline: none; box-sizing: border-box; background: var(--bg-gray);
        }

        .category-nav { display: flex; justify-content: center; gap: 10px; padding: 5px 0 15px; border-bottom: 1px solid #eee; }
        .nav-item { font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; color: #888; padding: 6px 12px; border-radius: 20px; transition: 0.3s; }
        .nav-item.active { color: #fff; background: #000; }

        .container { max-width: 500px; margin: 0 auto; padding: 15px 15px 100px; }
        .product-card { background: #fff; margin-bottom: 40px; border-bottom: 1px solid #eee; }
        
        .swiper { width: 100%; aspect-ratio: 1/1; background: var(--bg-gray); position: relative; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet-active { background: #000 !important; }

        /* 图片数字指示器 */
        .img-counter { 
            position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.6); 
            color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 11px; z-index: 10; 
        }

        .product-info { padding: 15px 0; text-align: left; }
        .product-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; min-height: 40px; }
        .product-price { color: var(--accent-color); font-size: 20px; font-weight: 900; margin-bottom: 15px; }

        .order-btn { 
            display: flex; align-items: center; justify-content: center;
            background-color: #000; color: #fff; text-decoration: none;
            padding: 16px 0; width: 100%; font-size: 15px; font-weight: bold; 
            border-radius: 6px; text-transform: uppercase;
        }
        .features { font-size: 11px; color: #999; margin-top: 12px; text-align: center; }
        #no-results { display: none; padding: 50px 0; color: #999; text-align: center; }
    </style>
</head>
<body>

<div class="sticky-header">
    <div class="header"><h1>LJR SNEAKERS</h1></div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search (e.g. Panda, Jordan)...">
    </div>
    <div class="category-nav">
        <div class="nav-item active" onclick="filterCat('All', this)">All</div>
        <div class="nav-item" onclick="filterCat('Dunk', this)">Dunk</div>
        <div class="nav-item" onclick="filterCat('Jordan', this)">Air Jordan</div>
    </div>
</div>

<div class="container">
    <div id="product-list"></div>
    <div id="no-results">No items found.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const myPhone = "8618506001902";
    const shopName = "LJR";

    // 注意：images 数组里写几个路径，网页就只显示几个位置，不循环，不错位
    const products = [
        {
            name: "Nike Dunk Low 'Panda' Black White",
            price: "$110.00",
            category: "Dunk",
            images: [
                "images/dunk-panda/1.jpg",
                "images/dunk-panda/2.jpg",
                "images/dunk-panda/3.jpg",
                "images/dunk-panda/4.jpg"
            ]
        },
        {
            name: "Jordan 1 Retro High OG Chicago",
            price: "$150.00",
            category: "Jordan",
            images: [
                "images/jordan-chicago/1.jpg",
                "images/jordan-chicago/2.jpg",
                "images/jordan-chicago/3.jpg",
                "images/jordan-chicago/4.jpg"
            ]
        }
    ];

    let currentCategory = 'All';
    let searchQuery = '';

    const listContainer = document.getElementById('product-list');
    const searchInput = document.getElementById('search-input');

    function renderProducts() {
        listContainer.innerHTML = '';
        const filtered = products.filter(p => {
            const matchesCat = currentCategory === 'All' || p.category === currentCategory;
            const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            document.getElementById('no-results').style.display = 'block';
        } else {
            document.getElementById('no-results').style.display = 'none';
            filtered.forEach((product, pIndex) => {
                const totalImg = product.images.length;
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const slidesHtml = product.images.map(img => `
                    <div class="swiper-slide"><img src="${img}" onerror="this.src='https://via.placeholder.com/500?text=Image+Not+Found'"></div>
                `).join('');

                const waMsg = encodeURIComponent(`Hi ${shopName}, I'm interested in: ${product.name}`);
                
                card.innerHTML = `
                    <div class="swiper swiper-${pIndex}">
                        <div class="swiper-wrapper">${slidesHtml}</div>
                        <div class="img-counter">1 / ${totalImg}</div>
                        <div class="swiper-pagination"></div>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${product.price}</div>
                        <a href="https://wa.me/${myPhone}?text=${waMsg}" target="_blank" class="order-btn">ORDER VIA WHATSAPP</a>
                        <div class="features">PREMIUM QUALITY • SHIP TO USA • FREE QC</div>
                    </div>
                `;
                listContainer.appendChild(card);
                
                new Swiper(`.swiper-${pIndex}`, {
                    loop: false, // 彻底关闭循环，防止图片位显示错误
                    pagination: { el: '.swiper-pagination', clickable: true },
                    on: {
                        slideChange: function () {
                            const counter = this.el.querySelector('.img-counter');
                            if(counter) counter.innerText = `${this.activeIndex + 1} / ${totalImg}`;
                        }
                    }
                });
            });
        }
    }

    window.filterCat = (cat, el) => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        renderProducts();
    };

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderProducts();
    });

    renderProducts();
</script>

</body>
</html>
