<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LJR NIKE - SMART CATALOG</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --main-color: #000; --accent-color: #e41e31; --bg-gray: #f9f9f9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #fff; color: #111; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        .sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; }
        .header { padding: 25px 0 10px; text-align: center; }
        .header h1 { 
            margin: 0; font-size: 34px; font-weight: 900; font-style: italic; text-transform: uppercase; 
            letter-spacing: -2.8px; line-height: 1;
            background: linear-gradient(135deg, #000 0%, #444 50%, #000 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { margin: 8px 0 0; font-size: 11px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        .search-container { padding: 10px 15px; }
        #search-input { width: 100%; padding: 14px 18px; border: 1px solid #eee; border-radius: 12px; font-size: 14px; outline: none; box-sizing: border-box; background: var(--bg-gray); transition: 0.3s; }
        .category-nav { display: flex; justify-content: center; gap: 8px; padding: 5px 0 15px; flex-wrap: wrap; }
        .nav-item { font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; color: #999; padding: 8px 16px; border-radius: 25px; transition: 0.3s; }
        .nav-item.active { color: #fff; background: #000; }
        .container { max-width: 500px; margin: 0 auto; padding: 10px 15px 100px; }
        .product-card { background: #fff; margin-bottom: 45px; border-bottom: 1px solid #f0f0f0; }
        .swiper-list { width: 100%; aspect-ratio: 1/1; background: var(--bg-gray); position: relative; border-radius: 4px; }
        /* 关键：初始隐藏图片，加载成功才显示 */
        .swiper-slide { display: none; }
        .swiper-slide.is-valid { display: block; }
        .swiper-list .swiper-slide img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
        .img-counter { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; z-index: 10; }
        .product-info { padding: 20px 0; text-align: left; }
        .product-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; min-height: 44px; color: #000; line-height: 1.2; text-transform: uppercase; }
        .product-price { color: var(--accent-color); font-size: 22px; font-weight: 900; margin-bottom: 18px; }
        .order-btn { display: flex; align-items: center; justify-content: center; background-color: #000; color: #fff; text-decoration: none; padding: 18px 0; width: 100%; font-size: 15px; font-weight: 900; border-radius: 8px; text-transform: uppercase; }
        #viewer-overlay { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
        .swiper-viewer { width: 100%; height: 100%; }
        .swiper-viewer .swiper-zoom-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #viewer-top-bar { position: absolute; top: 20px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10002; color: #fff; box-sizing: border-box; }
        #viewer-close { font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div id="viewer-overlay">
    <div id="viewer-top-bar"><span id="viewer-counter">1 / 1</span><span id="viewer-close">&times;</span></div>
    <div class="swiper swiper-viewer"><div class="swiper-wrapper"></div></div>
</div>

<div class="sticky-header">
    <div class="header"><h1>LJR NIKE</h1><p>Premium Batch • US Direct • Best QC</p></div>
    <div class="search-container"><input type="text" id="search-input" placeholder="Search sneakers..."></div>
    <div class="category-nav">
        <div class="nav-item active" onclick="filterCat('All', this)">All</div>
        <div class="nav-item" onclick="filterCat('Dunk', this)">Dunk</div>
        <div class="nav-item" onclick="filterCat('Jordan', this)">Air Jordan</div>
    </div>
</div>

<div class="container"><div id="product-list"></div><div id="no-results" style="display:none; text-align:center; padding:50px;">No items found.</div></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const myPhone = "8618506001902";
    const imgExt = ".jpg"; 
    const maxPossibleImages = 12; // 自动探测最多12张图

    // 数据库：不再需要写 count，代码会自动找
    const products = [
        { name: "Air Jordan 4 'Black Cat'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4_Black Cat" },
        { name: "Air Jordan 4 'Laser'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4_Laser" },
        { name: "Air Jordan 4 'Navy'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4_Navy" },
        { name: "Air Jordan 4 'Pine Green'", price: "$150.00", category: "Jordan", folder: "Air Jordan 4_Pine Green" },
        { name: "Air Jordan 4 OG 'Brick by Brick'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4 OG _Brick by Brick_ Bl..." },
        { name: "Air Jordan 4 Retro 'Imperial Purple'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4 Retro _Imperial Purple" },
        { name: "Air Jordan 4 Retro OG SP Undefeated", price: "$160.00", category: "Jordan", folder: "Air Jordan 4 Retro OG SP Undefea..." },
        { name: "Air Jordan 4 Retro White Cement", price: "$145.00", category: "Jordan", folder: "Air Jordan 4 Retro White Cement" },
        { name: "Air Jordan 4 'Thunder'", price: "$145.00", category: "Jordan", folder: "Air Jordan 4 Thunder" },
        { name: "Air Jordan 4 'White Thunder' Retro", price: "$145.00", category: "Jordan", folder: "Air Jordan 4 White Thunder Retro" },
        { name: "Air Jordan 5 'Wolf Grey'", price: "$140.00", category: "Jordan", folder: "Air Jordan 5_Wolf Grey" },
        { name: "Air Jordan 5 'GRAPE'", price: "$140.00", category: "Jordan", folder: "Air Jordan 5 GRAPE" },
        { name: "Air Jordan 5 Retro 'White Metallic'", price: "$140.00", category: "Jordan", folder: "Air Jordan 5 Retro _White Metallic" },
        { name: "Air Jordan 5 Retro SP 'Dawn'", price: "$145.00", category: "Jordan", folder: "Air Jordan 5 Retro SP_Dawn" },
        { name: "Air Jordan 11 'RARE AIR'", price: "$155.00", category: "Jordan", folder: "Air Jordan 11 _RARE AIR" },
        { name: "Air Jordan 11 Low 'University Blue'", price: "$140.00", category: "Jordan", folder: "Air Jordan 11 Low _University Blue" },
        { name: "Air Jordan 11 Retro 'Gamma Blue'", price: "$155.00", category: "Jordan", folder: "Air Jordan 11 Retro _Gamma Blue" },
        { name: "Air Jordan 11 Retro 'Cap and Gown'", price: "$155.00", category: "Jordan", folder: "Air Jordan 11 Retro Cap and Gown" },
        { name: "Nike Dunk Low 'Panda'", price: "$110.00", category: "Dunk", folder: "dunk-panda" },
        { name: "Nike Dunk SB 'J-PACK CHICAGO'", price: "$125.00", category: "Dunk", folder: "dunk- SB 'J-PACK CHICAGO'" },
        { name: "Nike Dunk Low 'Argon' 2022", price: "$115.00", category: "Dunk", folder: "dunk-argon 2022" },
        { name: "Nike Dunk Low 'Chunky Dunky'", price: "$140.00", category: "Dunk", folder: "dunk-chun kydunky" },
        { name: "Nike Dunk Low 'Coast'", price: "$115.00", category: "Dunk", folder: "dunk-Coast" },
        { name: "Nike Dunk Low 'Fruity Pebbles'", price: "$120.00", category: "Dunk", folder: "dunk-fruit y pebbles" },
        { name: "Nike Dunk Low 'Game Royal'", price: "$115.00", category: "Dunk", folder: "dunk-gam e royal" },
        { name: "Nike Dunk Low 'Grey Fog'", price: "$115.00", category: "Dunk", folder: "dunk-grey fog" },
        { name: "Nike Dunk Low 'Kentucky'", price: "$115.00", category: "Dunk", folder: "dunk-kent ucky" },
        { name: "Nike Dunk Low 'Light Bone'", price: "$115.00", category: "Dunk", folder: "dunk-light bone" },
        { name: "Nike Dunk Low 'Light Orewood Brown'", price: "$115.00", category: "Dunk", folder: "dunk-Ligh t Orewood Brown" },
        { name: "Nike Dunk Low 'Miami Hurricanes'", price: "$115.00", category: "Dunk", folder: "dunk-mia mi hurricanes" },
        { name: "Nike Dunk Low RETRO SP 'ST. JOHN'S'", price: "$115.00", category: "Dunk", folder: "dunk-RET RO SP 'ST. JOHN'S'" },
        { name: "Nike Dunk SB x Travis Scott", price: "$150.00", category: "Dunk", folder: "dunk-sb x Travis Scott" },
        { name: "Nike Dunk Low 'Easter'", price: "$115.00", category: "Dunk", folder: "dunk-se easter" },
        { name: "Nike Dunk Low SP 'Brazil'", price: "$120.00", category: "Dunk", folder: "dunk-sp brazil" },
        { name: "Nike Dunk Low 'Syracuse'", price: "$120.00", category: "Dunk", folder: "dunk-syra cuse" },
        { name: "Nike Dunk Low 'Triple Pink'", price: "$110.00", category: "Dunk", folder: "dunk-tripl e pink" },
        { name: "Nike Dunk Low 'University Blue'", price: "$115.00", category: "Dunk", folder: "dunk-univ ersity blue" }
    ];

    function renderProducts() {
        const listContainer = document.getElementById('product-list');
        listContainer.innerHTML = '';
        
        products.filter(p => {
            const matchesCat = currentCategory === 'All' || p.category === currentCategory;
            return matchesCat && p.name.toLowerCase().includes(searchQuery.toLowerCase());
        }).forEach((product, pIndex) => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            let slidesHtml = '';
            for(let i=1; i <= maxPossibleImages; i++) {
                slidesHtml += `
                    <div class="swiper-slide" id="slide-${pIndex}-${i}">
                        <img src="images/${product.folder}/${i}${imgExt}" 
                             onload="this.parentElement.classList.add('is-valid'); updateCounter(${pIndex})"
                             onclick="openFullViewer('${product.folder}', ${i-1}, ${pIndex})">
                    </div>`;
            }

            card.innerHTML = `
                <div class="swiper swiper-list-${pIndex}">
                    <div class="swiper-wrapper">${slidesHtml}</div>
                    <div class="img-counter" id="counter-${pIndex}">1 / 1</div>
                    <div class="swiper-pagination"></div>
                </div>
                <div class="product-info">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price}</div>
                    <a href="https://wa.me/${myPhone}?text=Order:${encodeURIComponent(product.name)}" target="_blank" class="order-btn">ORDER VIA WHATSAPP</a>
                </div>
            `;
            listContainer.appendChild(card);
            
            // 延迟初始化 Swiper 以确保图片检测完成
            setTimeout(() => {
                new Swiper(`.swiper-list-${pIndex}`, {
                    pagination: { el: '.swiper-pagination' },
                    on: { slideChange: function() { updateCounter(pIndex, this.activeIndex + 1); } }
                });
            }, 300);
        });
    }

    // 核心逻辑：更新计数器，只计算加载成功的图片
    window.updateCounter = (pIndex, current = 1) => {
        const total = document.querySelectorAll(`.swiper-list-${pIndex} .is-valid`).length;
        const counterEl = document.getElementById(`counter-${pIndex}`);
        if(counterEl) counterEl.innerText = `${current} / ${total}`;
    };

    window.openFullViewer = (folder, startIdx, pIndex) => {
        const total = document.querySelectorAll(`.swiper-list-${pIndex} .is-valid`).length;
        const viewerWrapper = document.querySelector('.swiper-viewer .swiper-wrapper');
        let viewerSlides = '';
        for(let i=1; i <= total; i++) {
            viewerSlides += `<div class="swiper-slide"><div class="swiper-zoom-container"><img src="images/${folder}/${i}${imgExt}"></div></div>`;
        }
        viewerWrapper.innerHTML = viewerSlides;
        document.getElementById('viewer-overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        
        new Swiper('.swiper-viewer', {
            initialSlide: startIdx,
            zoom: true,
            on: { slideChange: function() { document.getElementById('viewer-counter').innerText = `${this.activeIndex + 1} / ${total}`; } }
        });
        document.getElementById('viewer-counter').innerText = `${startIdx + 1} / ${total}`;
    };

    // 其他逻辑保持不变
    let currentCategory = 'All';
    let searchQuery = '';
    document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderProducts(); };
    window.filterCat = (cat, el) => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        renderProducts();
    };
    document.getElementById('viewer-close').onclick = () => { document.getElementById('viewer-overlay').style.display = 'none'; document.body.style.overflow = 'auto'; };
    
    renderProducts();
</script>
</body>
</html>
