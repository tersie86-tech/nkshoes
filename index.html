<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LJR PREMIUM SNEAKERS</title>
    <style>
        /* 针对美国市场的现代简约风格 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; text-align: center; color: #111; }
        
        .header { background: #fff; padding: 25px 0; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; font-style: italic; }
        .header p { margin: 5px 0 0; font-size: 14px; color: #666; font-weight: 500; }

        .container { max-width: 600px; margin: 20px auto; padding: 10px; padding-bottom: 80px; }
        
        .product-card { background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; text-align: left; }
        .product-card img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 10px; }
        
        .product-info { padding: 20px; border-top: 1px solid #eee; }
        .product-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #111; line-height: 1.3; }
        .product-price { color: #e41e31; font-size: 24px; font-weight: 900; }
        .product-meta { font-size: 12px; color: #888; margin-top: 5px; text-transform: uppercase; font-weight: 600; }

        /* 底部固定购买按钮 */
        .order-btn { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background-color: #000; color: white; border: none; 
            padding: 18px 0; width: 90%; max-width: 500px; 
            font-size: 16px; font-weight: bold; text-align: center;
            cursor: pointer; transition: 0.3s; border-radius: 50px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 999; text-transform: uppercase;
        }
        .order-btn:hover { background-color: #333; transform: translateX(-50%) translateY(-2px); }
        .order-btn:active { transform: translateX(-50%) translateY(1px); }
        .wa-icon { width: 20px; height: 20px; margin-right: 10px; fill: #fff; }
    </style>
</head>
<body>

<div class="header">
    <h1>LJR SNEAKERS</h1>
    <p>Premium Quality | Direct Shipping</p>
</div>

<div class="container" id="product-list">
    </div>

<script>
    // 1. WhatsApp 配置 (纯数字)
    const myPhone = "8618506001902";
    const shopName = "LJR";

    // 2. 商品列表 (在这里增加或修改鞋子)
    const products = [
        {
            name: "Nike Dunk Low 'Panda' Black White",
            price: "$110.00",
            image: "images/dunk-panda/1.jpg" // 确保路径正确
        },
        {
            name: "Jordan 1 Retro High OG Chicago Lost and Found",
            price: "$150.00",
            image: "images/jordan-chicago/1.jpg"
        },
        // 继续在这里添加...
    ];

    const listContainer = document.getElementById('product-list');
    
    products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        // 编码英文消息文案 (适合美国市场)
        const message = encodeURIComponent(`Hi ${shopName}, I'm interested in ordering the:\nItem: ${product.name}\nPrice: ${product.price}\nPlease let me know the next steps.`);
        const waLink = `https://wa.me/${myPhone}?text=${message}`;

        card.innerHTML = `
            <img src="${product.image}" alt="${product.name}">
            <div class="product-info">
                <div class="product-title">${product.name}</div>
                <div class="product-price">${product.price}</div>
                <div class="product-meta">Free QC Photos | Worldwide Shipping</div>
                <a href="${waLink}" target="_blank" class="order-btn">
                    <svg class="wa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-115.9zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.4-8.6-44.6-27.6-16.5-14.7-27.6-32.8-30.8-38.3-3.2-5.5-.3-8.5 2.5-11.2 2.5-2.6 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.5 5.5-9.3 1.9-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.6 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
                    Order via WhatsApp
                </a>
            </div>
        `;
        listContainer.appendChild(card);
    });
</script>

</body>
</html>
