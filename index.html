<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LJR NIKE - PREMIUM SHOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --main-color: #000; 
            --accent-color: #e41e31; 
            --bg-gray: #f8f8f8; 
            --text-main: #111;
            --text-muted: #888;
            --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        body { 
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background-color: #fff; color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
        }

        /* 顶部固定导航 - 增加磨砂效果 */
        .sticky-header { 
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 0.5px solid rgba(0,0,0,0.08); 
        }

        .header { padding: 18px 0 12px; display: flex; justify-content: center; }
        #shop-logo { width: 45%; max-width: 150px; height: auto; display: block; }

        /* 搜索框美化 */
        .search-container { padding: 8px 16px; position: relative; }
        #search-input { 
            width: 100%; padding: 14px 40px 14px 16px; 
            border: 1px solid transparent; border-radius: 12px; 
            font-size: 15px; outline: none; background: var(--bg-gray); 
            box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #search-input:focus { background: #fff; border-color: #000; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }

        /* 分类标签美化 */
        .category-nav { display: flex; justify-content: center; gap: 12px; padding: 12px 0 16px; }
        .nav-item { 
            font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; 
            color: var(--text-muted); padding: 8px 20px; border-radius: 25px; 
            transition: 0.3s; border: 1.5px solid #eee; 
        }
        .nav-item.active { color: #fff; background: #000; border-color: #000; }

        .container { max-width: 500px; margin: 0 auto; padding: 10px 16px 100px; }

        /* 商品卡片升级 */
        .product-card { 
            background: #fff; margin-bottom: 50px; border-radius: 16px; 
            overflow: hidden; transition: transform 0.3s;
        }
        .swiper-list { 
            width: 100%; aspect-ratio: 1/1; background: #fdfdfd; 
            position: relative; border-radius: 16px; overflow: hidden;
        }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .img-counter { 
            position: absolute; bottom: 15px; right: 15px; 
            background: rgba(0,0,0,0.6); color: #fff; 
            padding: 4px 12px; border-radius: 20px; font-size: 11px; 
            font-weight: 600; z-index: 10; backdrop-filter: blur(5px);
        }

        .product-info { padding: 20px 4px; }
        .product-title { 
            font-size: 18px; font-weight: 800; margin-bottom: 8px; 
            line-height: 1.2; text-transform: uppercase; letter-spacing: -0.5px;
        }
        .product-price { 
            color: var(--accent-color); font-size: 24px; font-weight: 900; 
            margin-bottom: 15px; font-family: 'Arial Black', sans-serif;
        }

        /* 标签美化 */
        .service-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .service-tag { 
            font-size: 10px; color: #666; background: #f2f2f2; 
            padding: 5px 10px; border-radius: 6px; font-weight: 600;
        }

        /* 按钮动画 */
        .order-btn { 
            display: flex; align-items: center; justify-content: center; 
            background-color: #000; color: #fff; text-decoration: none; 
            padding: 18px 0; width: 100%; font-size: 14px; font-weight: 800; 
            border-radius: 12px; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .order-btn:active { transform: scale(0.97); background-color: #333; }

        /* 全屏查看器 */
        #viewer-overlay { 
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; 
            width: 100%; height: 100%; background: #000; flex-direction: column; 
        }
        #viewer-top-bar { padding: 50px 20px 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        #viewer-close { font-size: 24px; cursor: pointer; width: 40px; text-align: right; }

        /* 动画加载列表 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card { animation: fadeIn 0.5s ease both; }
    </style>
</head>
<body>

<div id="viewer-overlay">
    <div id="viewer-top-bar">
        <span id="viewer-counter">1 / 4</span>
        <span id="viewer-close">✕</span>
    </div>
    <div class="swiper swiper-viewer"><div class="swiper-wrapper"></div></div>
</div>

<div class="sticky-header">
    <div class="header">
        <img src="images/logo.png" alt="LJR NIKE Logo" id="shop-logo">
    </div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search (e.g. Panda, Jordan 4)...">
    </div>
    <div class="category-nav">
        <div class="nav-item active" onclick="filterCat('All', this)">All</div>
        <div class="nav-item" onclick="filterCat('Dunk', this)">Dunk</div>
        <div class="nav-item" onclick="filterCat('Jordan', this)">Jordan</div>
    </div>
</div>

<div class="container">
    <div id="product-list"></div>
    <div id="no-results" style="display:none; text-align:center; padding:100px 20px; color:#999;">
        <div style="font-size: 40px; margin-bottom: 10px;">👟</div>
        <p>No sneakers found matching your search.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const myPhone = "8618506001902";
    const products = [
        { name: "Air Jordan 4 'Black Cat'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 _Black Cat" },
        { name: "Air Jordan 4 'Laser'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 _Laser" },
        { name: "Air Jordan 4 'Navy'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 _Navy" },
        { name: "Air Jordan 4 'Pine Green'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 _Pine Green" },
        { name: "Air Jordan 4 OG 'Brick by Brick_ BIKE'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 OG _Brick by Brick_ BIKE" },
        { name: "Air Jordan 4 Retro 'Imperial Purple'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 Retro _Imperial Purple" },
        { name: "Air Jordan 4 Retro White Cement", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 Retro White Cement" },
        { name: "Air Jordan 4 'Thunder'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 Thunder" },
        { name: "Air Jordan 4 'White Thunder' Retro", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 White Thunder Retro" },
        { name: "Air Jordan 5 'Wolf Grey'", price: "$199.00", category: "Jordan", folder: "Air Jordan 5 _Wolf Grey" },
        { name: "Air Jordan 5 'GRAPE'", price: "$199.00", category: "Jordan", folder: "Air Jordan 5 GRAPE" },
        { name: "Air Jordan 5 Retro SP 'Dawn'", price: "$199.00", category: "Jordan", folder: "Air Jordan 5 Retro SP_Dawn" },
        { name: "Air Jordan 11 'RARE AIR'", price: "$199.00", category: "Jordan", folder: "Air Jordan 11 _RARE AIR" },
        { name: "Air Jordan 11 Low 'University Blue'", price: "$199.00", category: "Jordan", folder: "Air Jordan 11 Low _University Blue" },
        { name: "Air Jordan 11 Retro 'Gamma Blue'", price: "$199.00", category: "Jordan", folder: "Air Jordan 11 Retro _Gamma Blue" },
        { name: "Air Jordan 4 Retro OG SP Undefeated'", price: "$199.00", category: "Jordan", folder: "Air Jordan 4 Retro OG SP Undefeated" },
        { name: "Air Jordan 5 Retro _White Metallic'", price: "$199.00", category: "Jordan", folder: "Air Jordan 5 Retro _White Metallic" },
        { name: "Nike Dunk Low 'Panda'", price: "$59.00", category: "Dunk", folder: "dunk-panda" },
        { name: "Nike Dunk SB 'J-PACK CHICAGO'", price: "$59.00", category: "Dunk", folder: "dunk- SB 'J-PACK CHICAGO'" },
        { name: "Nike Dunk Low 'Argon' 2022", price: "$59.00", category: "Dunk", folder: "dunk-argon 2022" },
        { name: "Nike Dunk Low 'Chunky Dunky'", price: "$59.00", category: "Dunk", folder: "dunk-chunkydunky" },
        { name: "Nike Dunk Low 'Coast'", price: "$59.00", category: "Dunk", folder: "dunk-Coast" },
        { name: "Nike Dunk Low 'fruity pebbles'", price: "$59.00", category: "Dunk", folder: "dunk-fruity pebbles" },
        { name: "Nike Dunk Low 'Grey Fog'", price: "$59.00", category: "Dunk", folder: "dunk-grey fog" },
        { name: "Nike Dunk Low 'game royal'", price: "$59.00", category: "Dunk", folder: "dunk-game royal" },
        { name: "Nike Dunk Low 'Kentucky'", price: "$59.00", category: "Dunk", folder: "dunk-kentucky" },
        { name: "Nike Dunk Low 'Light Bone'", price: "$59.00", category: "Dunk", folder: "dunk-light bone" },
        { name: "Nike Dunk Low 'Light Orewood Brown'", price: "$59.00", category: "Dunk", folder: "dunk-Light Orewood Brown" },
        { name: "Nike Dunk Low 'Miami Hurricanes'", price: "$59.00", category: "Dunk", folder: "dunk-miami hurricanes" },
        { name: "Nike Dunk SB x Travis Scott", price: "$59.00", category: "Dunk", folder: "dunk-sb x Travis Scott" },
        { name: "Nike Dunk RETRO SP 'ST. JOHN'S", price: "$59.00", category: "Dunk", folder: "dunk-RETRO SP 'ST. JOHN'S'" },
        { name: "Nike Dunk Low 'se easter'", price: "$59.00", category: "Dunk", folder: "dunk-se easter" },
        { name: "Nike Dunk Low SP 'Brazil'", price: "$59.00", category: "Dunk", folder: "dunk-sp brazil" },
        { name: "Nike Dunk Low 'Syracuse'", price: "$59.00", category: "Dunk", folder: "dunk-syracuse" },
        { name: "Nike Dunk Low 'Triple Pink'", price: "$59.00", category: "Dunk", folder: "dunk-triple pink" },
        { name: "Nike Dunk Low 'University Blue'", price: "$59.00", category: "Dunk", folder: "dunk-university blue" }
    ];

    let currentCategory = 'All';
    let searchQuery = '';

    function render() {
        const container = document.getElementById('product-list');
        container.innerHTML = '';
        
        const filtered = products.filter(p => 
            (currentCategory === 'All' || p.category === currentCategory) && 
            p.name.toLowerCase().includes(searchQuery.toLowerCase())
        );

        if(filtered.length === 0) {
            document.getElementById('no-results').style.display = 'block';
            return;
        }
        document.getElementById('no-results').style.display = 'none';

        filtered.forEach((p, pIdx) => {
            const card = document.createElement('div');
            card.className = 'product-card';
            //  staggered delay for animation
            card.style.animationDelay = `${pIdx * 0.05}s`;
            
            let slidesHtml = '';
            for(let i=1; i<=4; i++) {
                slidesHtml += `
                    <div class="swiper-slide">
                        <img src="images/${p.folder}/${i}.jpg" 
                             onerror="this.src='https://via.placeholder.com/600x600?text=IMAGE+PREVIEW'" 
                             onclick="openViewer('${p.folder}', ${i-1})">
                    </div>`;
            }

            const waMsg = `Hi! I want to order this:\n👟 *${p.name}*\n💰 Price: ${p.price}\n\nPlease check availability.`;

            card.innerHTML = `
                <div class="swiper swiper-list-${pIdx}">
                    <div class="swiper-wrapper">${slidesHtml}</div>
                    <div class="img-counter">1 / 4</div>
                </div>
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price}</div>
                    <div class="service-tags">
                        <div class="service-tag">FREE SHIPPING</div>
                        <div class="service-tag">LJR PREMIUM</div>
                        <div class="service-tag">FAST DELIVERY</div>
                    </div>
                    <a href="https://wa.me/${myPhone}?text=${encodeURIComponent(waMsg)}" target="_blank" class="order-btn">
                        Order on WhatsApp
                    </a>
                </div>
            `;
            container.appendChild(card);

            new Swiper(`.swiper-list-${pIdx}`, {
                on: {
                    slideChange: function () {
                        card.querySelector('.img-counter').innerText = `${this.activeIndex + 1} / 4`;
                    }
                }
            });
        });
    }

    let viewerSwiper = null;
    window.openViewer = (folder, startIndex) => {
        const overlay = document.getElementById('viewer-overlay');
        const wrapper = document.querySelector('.swiper-viewer .swiper-wrapper');
        wrapper.innerHTML = '';
        for(let i=1; i<=4; i++) {
            wrapper.innerHTML += `<div class="swiper-slide"><div class="swiper-zoom-container"><img src="images/${folder}/${i}.jpg"></div></div>`;
        }
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        if(viewerSwiper) viewerSwiper.destroy();
        viewerSwiper = new Swiper('.swiper-viewer', {
            initialSlide: startIndex,
            zoom: true,
            on: {
                slideChange: function() {
                    document.getElementById('viewer-counter').innerText = `${this.activeIndex + 1} / 4`;
                }
            }
        });
        document.getElementById('viewer-counter').innerText = `${startIndex + 1} / 4`;
    };

    document.getElementById('viewer-close').onclick = () => {
        document.getElementById('viewer-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        render();
    });

    window.filterCat = (cat, el) => {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        render();
    };

    render();
</script>
</body>
</html>
