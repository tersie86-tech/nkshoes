<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LJR PREMIUM SNEAKERS</title>
    <!-- 引入滑动库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --main-color: #000; --accent-color: #e41e31; --bg-gray: #f8f8f8; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #fff; color: #111; }
        
        /* 顶部固定区域 */
        .sticky-header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; }
        .header { padding: 20px 0 10px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; font-style: italic; }
        
        /* 搜索框样式 */
        .search-container { padding: 10px 15px; }
        #search-input { 
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; 
            font-size: 14px; outline: none; box-sizing: border-box; background: var(--bg-gray);
        }

        /* 分类导航条 */
        .category-nav { display: flex; justify-content: center; gap: 15px; padding: 10px 0 15px; border-bottom: 1px solid #eee; }
        .nav-item { 
            font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; 
            color: #888; transition: 0.3s; padding: 5px 10px; border-radius: 4px;
        }
        .nav-item.active { color: #000; background: #f0f0f0; }

        /* 内容区域 */
        .container { max-width: 500px; margin: 0 auto; padding: 15px 15px 100px; }
        .product-card { background: #fff; margin-bottom: 40px; border-bottom: 1px solid #eee; display: block; }
        
        /* 轮播图 */
        .swiper { width: 100%; aspect-ratio: 1/1; background: var(--bg-gray); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet-active { background: #000 !important; }

        .product-info { padding: 15px 0; text-align: left; }
        .product-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; min-height: 40px; }
        .product-price { color: var(--accent-color); font-size: 20px; font-weight: 900; margin-bottom: 15px; }

        .order-btn { 
            display: flex; align-items: center; justify-content: center;
            background-color: #000; color: #fff; text-decoration: none;
            padding: 15px 0; width: 100%; font-size: 15px; font-weight: bold; 
            border-radius: 4px; text-transform: uppercase;
        }
        .features { font-size: 11px; color: #999; margin-top: 10px; text-align: center; text-transform: uppercase; }
        
        /* 无搜索结果提示 */
        #no-results { display: none; padding: 50px 0; color: #999; }
    </style>
</head>
<body>

<div class="sticky-header">
    <div class="header">
        <h1>LJR SNEAKERS</h1>
    </div>

    <!-- 搜索功能 -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by name (e.g. Panda, Jordan)...">
    </div>

    <!-- 分类导航 -->
    <div class="category-nav">
        <div class="nav-item active" onclick="filterCategory('All', this)">All</div>
        <div class="nav-item" onclick="filterCategory('Dunk', this)">Dunk</div>
        <div class="nav-item" onclick="filterCategory('Jordan', this)">Air Jordan</div>
    </div>
</div>

<div class="container">
    <div id="product-list"></div>
    <div id="no-results">No sneakers found matching your search.</div>
</div>

<!-- 脚本部分 -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const myPhone = "8618506001902";
    const shopName = "LJR";

    // 【商品数据配置】增加了一个 category 字段用于分类
    const products = [
        {
            name: "Nike Dunk Low 'Panda' Black White",
            price: "$110.00",
            category: "Dunk",
            images: ["images/dunk-panda/1.jpg", "images/dunk-panda/2.jpg"]
        },
        {
            name: "Jordan 1 Retro High OG Chicago",
            price: "$150.00",
            category: "Jordan",
            images: ["images/jordan-chicago/1.jpg", "images/jordan-chicago/2.jpg"]
        },
        {
            name: "Nike Kobe 6 Protro 'Reverse Grinch'",
            price: "$165.00",
            category: "Other",
            images: ["images/kobe-grinch/1.jpg"]
        }
    ];

    let currentCategory = 'All';
    let searchQuery = '';

    const listContainer = document.getElementById('product-list');
    const searchInput = document.getElementById('search-input');
    const noResults = document.getElementById('no-results');

    // 核心渲染函数
    function renderProducts() {
        listContainer.innerHTML = '';
        const filtered = products.filter(p => {
            const matchesCat = currentCategory === 'All' || p.category === currentCategory;
            const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
            filtered.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let slidesHtml = product.images.map(img => `
                    <div class="swiper-slide"><img src="${img}" onerror="this.src='https://via.placeholder.com/500?text=LJR+Sneakers'"></div>
                `).join('');

                const message = encodeURIComponent(`Hi ${shopName}, I'm interested in:\n${product.name}\nPrice: ${product.price}`);
                
                card.innerHTML = `
                    <div class="swiper swiper-${index}">
                        <div class="swiper-wrapper">${slidesHtml}</div>
                        <div class="swiper-pagination"></div>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">${product.price}</div>
                        <a href="https://wa.me/${myPhone}?text=${message}" target="_blank" class="order-btn">ORDER VIA WHATSAPP</a>
                        <div class="features">Free QC • Ship to USA • Premium Batch</div>
                    </div>
                `;
                listContainer.appendChild(card);
                
                new Swiper(`.swiper-${index}`, {
                    loop: true,
                    pagination: { el: '.swiper-pagination', clickable: true }
                });
            });
        }
    }

    // 分类点击逻辑
    window.filterCategory = (cat, el) => {
        currentCategory = cat;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        renderProducts();
    };

    // 搜索输入逻辑
    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderProducts();
    });

    // 初始化页面
    renderProducts();
</script>

</body>
</html>
